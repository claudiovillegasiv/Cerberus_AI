# El puerto donde el Orquestador espera encontrar a este agente
server.port=8081
spring.application.name=microservicio-desarrollo

# Conexion a Ollama apuntando al modelo especialista
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=agente-desarrollo
langchain4j.ollama.chat-model.timeout=5m