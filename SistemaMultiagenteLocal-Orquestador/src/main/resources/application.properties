spring.application.name=orquestador-service
server.port=8080

# Puerto por defecto donde Ollama escucha peticiones
langchain4j.ollama.chat-model.base-url=http://localhost:11434

# El nombre exacto de tu modelo compilado
langchain4j.ollama.chat-model.model-name=prueba-agente

# Configuración del modelo Ollama en LangChain4j
langchain4j.ollama.chat-model.format=json

langchain4j.ollama.chat-model.timeout=5m